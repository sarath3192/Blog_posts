<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title description">
  <title id="title">Humanity and artificial intelligence</title>
  <desc id="description">A human silhouette and a network of glowing AI nodes face one another across a shared horizon.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b35"/>
      <stop offset="1" stop-color="#283b63"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0b978"/>
      <stop offset=".52" stop-color="#f8e3bc"/>
      <stop offset="1" stop-color="#83d7e6"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#fff7da" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffc987" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="640" rx="34" fill="url(#sky)"/>
  <circle cx="600" cy="330" r="230" fill="url(#sunGlow)"/>
  <path d="M0 428c170-46 276-39 420 1s255 38 390-3 242-42 390-7v221H0Z" fill="#182844"/>
  <path d="M0 493c179-40 306-26 445 9s277 35 408-2 230-31 347-4v144H0Z" fill="#111c32"/>
  <path d="M80 448c188-39 297-22 438 15 37 10 83 17 133 19 88 4 159-9 236-30 79-22 142-30 233-24" fill="none" stroke="url(#horizon)" stroke-width="3" opacity=".85"/>
  <circle cx="600" cy="475" r="10" fill="#fff3d2" filter="url(#glow)"/>
  <g opacity=".52" fill="none" stroke="#a9c4ee" stroke-width="2">
    <path d="m875 195 69 55 79-23 52 66-36 71-82 18-62-49-87 3-29-74Z"/>
    <path d="m944 250 13 83m66-106-14 72m66-6-74 40m-98-25 98-15m-185 18 123-3"/>
    <path d="m858 262 86-12 79 113m-79-113 132 31"/>
  </g>
  <g fill="#b7eaff" filter="url(#glow)">
    <circle cx="875" cy="195" r="6"/><circle cx="944" cy="250" r="8"/><circle cx="1023" cy="227" r="7"/>
    <circle cx="1075" cy="293" r="6"/><circle cx="1039" cy="364" r="8"/><circle cx="957" cy="382" r="5"/>
    <circle cx="895" cy="333" r="7"/><circle cx="866" cy="259" r="5"/><circle cx="1010" cy="333" r="5"/>
  </g>
  <g fill="#f6d5ac">
    <circle cx="333" cy="269" r="43"/>
    <path d="M247 445c7-79 37-127 86-127s79 48 86 127v39H247Z"/>
    <path d="M285 214c8-37 32-58 66-58 31 0 55 20 63 54-21-15-47-21-73-14-20 5-37 12-56 18Z" fill="#14223d"/>
  </g>
  <path d="M360 317c15 22 24 48 30 81" fill="none" stroke="#f4c995" stroke-width="7" stroke-linecap="round"/>
  <path d="M395 397c65 15 118 36 165 61" fill="none" stroke="#f6d5ac" stroke-width="10" stroke-linecap="round"/>
  <circle cx="565" cy="464" r="5" fill="#fff3d2"/>
  <g fill="#d9e9ff" font-family="Arial, sans-serif" font-size="13" letter-spacing="3" opacity=".78">
    <text x="253" y="536">HUMAN EXPERIENCE</text>
    <text x="847" y="536">MACHINE INTELLIGENCE</text>
  </g>
  <path d="M459 564h282" stroke="#91a8ca" stroke-width="1" opacity=".35"/>
</svg>
